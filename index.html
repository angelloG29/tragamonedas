<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Neon Slots — Tragamonedas</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <div class="container">
    <!-- Marquesina / Letrero superior -->
    <header class="marquee">
      <h1 class="title">NEON SLOTS</h1>
      <div class="lights">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </header>

    <!-- Slot Machine -->
    <main class="slot-machine">
      <section class="screen">
        <!-- Reels -->
        <div class="reels" aria-hidden="false">
          <div class="reel" id="reel-0"><div class="symbol">🍒</div></div>
          <div class="reel" id="reel-1"><div class="symbol">🍋</div></div>
          <div class="reel" id="reel-2"><div class="symbol">💎</div></div>
        </div>

        <!-- Línea central (decorativa) -->
        <div class="payline"></div>

        <!-- Mensajes de resultado flotantes -->
        <div id="resultMessage" class="result-message" aria-live="polite"></div>
        <div id="alertBox" class="alert-box" role="alert" aria-live="assertive"></div>
      </section>

      <!-- Panel de controles -->
      <aside class="controls">
        <div class="stat">
          <label>Balance</label>
          <div id="balance" class="value">$1000</div>
        </div>

        <div class="bet-controls">
          <label>Apuesta</label>
          <div class="bet-row">
            <button id="betDown" class="btn small">−</button>
            <div id="betDisplay" class="value betValue">$10</div>
            <button id="betUp" class="btn small">+</button>
          </div>
          <div class="bet-range">Min $10 — Max $100</div>
        </div>

        <button id="spinBtn" class="btn spin">GIRAR</button>
      </aside>
    </main>

    <footer class="footer">
      <small></small>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
